  move-to-http-header="true"

<script nonce="aem">
  /* Set the reading direction during head parse. scripts.js is a module and runs
     after the document is parsed, so the Arabic estate painted left to right and
     flipped at readyState complete, where live serves dir="rtl" and never does.
     The locale table is duplicated here on purpose: an import would defer this
     past the flash it exists to prevent. scripts/locale.js owns the real one and
     applyLocale still runs, so this only has to be right about direction. */
  (function () {
    var rtl = { 'ar-sa': 1 };
    var seg = String(window.location.pathname).split('/')[1] || '';
    document.documentElement.dir = rtl[seg.toLowerCase()] ? 'rtl' : 'ltr';
  })();
</script>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
